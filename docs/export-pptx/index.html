<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exportar PPTX - SDD Az1nn</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Exportar PPTX</h1>
      <p>
        Ferramenta para montar slides a partir de prompts/JSON e exportar para a pasta padrão de download
        ou para uma pasta selecionada no navegador.
      </p>

      <section class="card">
        <label for="fileName">Nome do arquivo (.pptx):</label>
        <input id="fileName" type="text" value="desenvolvimento-assistido-por-ia-az1nn.pptx" />
      </section>

      <section class="card">
        <label for="slidesJson">Conteúdo dos slides (JSON):</label>
        <textarea id="slidesJson" spellcheck="false"></textarea>
      </section>

      <section class="card actions">
        <button id="loadExample">Carregar exemplo</button>
        <button id="downloadDefault">Exportar (pasta padrão)</button>
        <button id="pickFolder">Selecionar pasta</button>
        <button id="exportSelected" disabled>Exportar (pasta selecionada)</button>
      </section>

      <p id="folderInfo">Pasta selecionada: nenhuma (exportação padrão usa Downloads).</p>
      <p id="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
