name: Export PPTX Example

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/export-pptx/**"
      - ".github/workflows/export-pptx-example.yml"

jobs:
  generate-pptx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip python-pptx

      - name: Generate PPTX example
        run: python docs/export-pptx/generate_example.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdd-pptx-example
          path: docs/export-pptx/output/desenvolvimento-assistido-por-ia-az1nn.pptx
